name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy specific image tag (optional)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  backend-cd:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
      ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set Image Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        if: github.event_name == 'workflow_run'
        run: |
          cd backend
          docker build \
            -t ${{ secrets.ECR_REPO_URI }}:${{ steps.vars.outputs.IMAGE_TAG }} \
            -t ${{ secrets.ECR_REPO_URI }}:latest \
            .
          docker push ${{ secrets.ECR_REPO_URI }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ secrets.ECR_REPO_URI }}:latest

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ secrets.ECR_REPO_URI }}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true