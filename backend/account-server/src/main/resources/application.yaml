debug: false

server:
  port: 8082

logging:
  level:
    arile.toy.stocksystem: debug

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  streams:
    user:
      key: user-events
      consumer-group: account-group
    trade-executed:
      key: trade-executed-events
      consumer-group: account-group

spring:
  application.name: account-server
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_PW}
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate.ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: true
  sql.init.mode: always

---

spring:
  config.activate.on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username:
    password:

redis:
  host: localhost
  port: 6379
  streams:
    user:
      key: user-events
      consumer-group: account-group