# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod)
# 스키마는 Flyway 마이그레이션으로만 변경하고, JPA 는 엔티티와 테이블 일치 여부만 검증함.
spring:
  jpa:
    defer-datasource-initialization: false
    hibernate.ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: false
  sql.init.mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 여러 서버가 같은 DB 를 쓰더라도 이력이 섞이지 않도록 서버별 이력 테이블 사용
    table: flyway_schema_history_bff
