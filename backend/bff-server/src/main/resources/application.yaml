account:
  initial-balance: 1000000000

account-api:
  base-url: ${ACCOUNT_API_URL}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}
  nickname: ${ADMIN_NICKNAME:관리자}

stock-api:
  base-url: ${STOCK_API_URL}

debug: false

frontend:
  url: ${FE_URL}

jwt:
  secret-key: ${SECRET_KEY}

logging:
  level:
    arile.toy.stocksystem: debug
    org.springframework.web.service: debug

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

  streams:
    user:
      key: user-events

    order:
      prefix: order-events

    cancel:
      prefix: cancel-events

    auto-order:
      prefix: auto-order-events

    auto-cancel:
      prefix: auto-cancel-events

    trailing-stop:
      prefix: trailing-stop-events

    trailing-stop-cancel:
      prefix: trailing-stop-cancel-events

    otoco:
      prefix: otoco-events

    otoco-cancel:
      prefix: otoco-cancel-events

    alert:
      prefix: alert-events

    alert-cancel:
      prefix: alert-cancel-events

stock-groups:
  groups:
    A:
      - "005930"
      - "000660"
      - "373220"
      - "207940"
      - "005380"
      - "000270"
      - "035420"
      - "005490"
      - "068270"
      - "105560"
      - "196170"
      - "247540"
      - "036930"
      - "277810"
      - "240810"
    B:
    CLOSE:

stock-sectors:
  groups:
    반도체:
      - "005930"
      - "000660"
      - "036930"
      - "240810"
    2차전지:
      - "373220"
      - "247540"
    바이오:
      - "207940"
      - "068270"
      - "196170"
    자동차:
      - "005380"
      - "000270"
    IT/플랫폼:
      - "035420"
    철강/소재:
      - "005490"
    금융:
      - "105560"
    로봇:
      - "277810"

spring:
  application.name: bff-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_PW}
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate.ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: true
  sql.init.mode: always
  task:
    scheduling:
      pool:
        size: 6

