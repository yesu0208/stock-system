# 부하 테스트 전용: true 면 장 상태와 관계없이 주문을 받는다 (운영에서는 켜지 않음)
market-phase:
  force-open: ${MARKET_PHASE_FORCE_OPEN:false}

api:
  approval-key-url: ${APPROVAL_KEY_URL}
  app-key: ${APP_KEY}
  app-secret: ${APP_SECRET}
  ws-url: ${WS_URL}

account-api:
  base-url: ${ACCOUNT_API_URL}

chart-api:
  base-url: ${CHART_API_URL}
  appkey: ${CHART_API_APPKEY}
  appsecret: ${CHART_API_APPSECRET}

debug: false

logging:
  level:
    arile.toy.stocksystem: debug
    org.springframework.web.service: debug

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

  streams:
    order:
      prefix: order-events
      consumer-group: stock-group

    cancel:
      prefix: cancel-events
      consumer-group: stock-group

    auto-order:
      prefix: auto-order-events
      consumer-group: stock-group

    auto-cancel:
      prefix: auto-cancel-events
      consumer-group: stock-group

    trailing-stop:
      prefix: trailing-stop-events
      consumer-group: stock-group

    trailing-stop-cancel:
      prefix: trailing-stop-cancel-events
      consumer-group: stock-group

    otoco:
      prefix: otoco-events
      consumer-group: stock-group

    otoco-cancel:
      prefix: otoco-cancel-events
      consumer-group: stock-group

    alert:
      prefix: alert-events
      consumer-group: stock-group

    alert-cancel:
      prefix: alert-cancel-events
      consumer-group: stock-group

    trade-executed:
      key: trade-executed-events

server:
  port: 8081
  group: ${SERVER_GROUP:A}

stock-groups:
  groups:
    A:
      - "005930"
      - "000660"
      - "373220"
      - "207940"
      - "005380"
      - "000270"
      - "035420"
      - "005490"
      - "068270"
      - "105560"
      - "196170"
      - "247540"
      - "036930"
      - "277810"
      - "240810"
      - "051910"
      - "006400"
      - "035720"
      - "012330"
      - "055550"
    B:
      - "000810"
      - "032830"
      - "086790"
      - "066570"
      - "003670"
      - "010130"
      - "011200"
      - "009150"
      - "034730"
      - "018260"
      - "145020"
      - "066970"
      - "086520"
      - "112040"
      - "263750"
      - "058470"
      - "214150"
      - "141080"
      - "078600"
      - "039030"
    CLOSE:

spring:
  application.name: stock-server
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_PW}
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate.ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: true
  sql.init.mode: always
  flyway.enabled: false
  task:
    scheduling:
      pool:
        size: 16

---

api:
  approval-key-url: test-approval-key-url
  app-key: test-app-key
  app-secret: test-app-secret
  ws-url: test-ws-url

account-api:
  base-url: http://localhost:8082

chart-api:
  base-url: https://test.com
  appkey: test-appkey
  appsecret: test-appsecret

server:
  group: A

stock-groups:
  groups:
    A:
      - "005930"

    CLOSE: []

spring:
