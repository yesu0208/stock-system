<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 주식</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h1>실시간 주식 데이터</h1>

<div>
    <h2>로그인</h2>
    <input type="text" id="username" placeholder="아이디" />
    <input type="password" id="password" placeholder="비밀번호" />
    <button onclick="login()">로그인</button>
</div>

<hr/>

<input type="text" id="stock-code" placeholder="종목 코드 입력 (예: 005930)" />
<button onclick="subscribeStock()">Subscribe</button>
<button onclick="unsubscribeStock()">Unsubscribe</button>

<h2>BID/ASK</h2>
<pre id="bidask-data"></pre>

<h2>체결가</h2>
<pre id="trade-data"></pre>

<script>
    let stompClient = null;
    let subscription = null;
    let currentCode = null;

    // JWT 로그인
    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            alert("아이디/비밀번호를 입력하세요.");
            return;
        }

        try {
            const res = await fetch("/api/v1/users/authenticate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                alert("로그인 실패");
                return;
            }

            const data = await res.json();
            localStorage.setItem("accessToken", data.accessToken);
            alert("로그인 성공");

            connectStomp(); // 로그인 후 STOMP 연결

        } catch (e) {
            console.error(e);
            alert("로그인 중 오류 발생");
        }
    }

    // STOMP 연결
    function connectStomp() {
        const token = localStorage.getItem("accessToken");
        if (!token) {
            alert("로그인이 필요합니다.");
            return;
        }

        const socket = new SockJS('/ws-stock');
        stompClient = Stomp.over(socket);

        stompClient.connect(
            { Authorization: "Bearer " + token },
            function (frame) {
                console.log("STOMP Connected:", frame);
            },
            function (error) {
                console.error("STOMP error:", error);
            }
        );
    }

    // 종목 구독
    function subscribeStock() {
        if (!stompClient || !stompClient.connected) {
            alert("STOMP가 연결되지 않았습니다. 로그인 후 시도하세요.");
            return;
        }

        const codeInput = document.getElementById('stock-code').value.trim();
        if (!codeInput) {
            alert("종목 코드를 입력하세요.");
            return;
        }

        if (subscription) {
            alert(`이미 ${currentCode} 종목을 구독 중입니다. 먼저 구독 해제하세요.`);
            return;
        }

        currentCode = codeInput;
        subscription = stompClient.subscribe(`/sub/stock/${currentCode}`, function (message) {
            const data = JSON.parse(message.body);

            if (data.type === "BIDASKPRICE") {
                document.getElementById('bidask-data').innerText = JSON.stringify(data, null, 2);
            } else if (data.type === "TRADEPRICE") {
                document.getElementById('trade-data').innerText = JSON.stringify(data, null, 2);
            }
        });

        console.log(`${currentCode} 구독 시작`);
    }

    // 종목 구독 해제
    function unsubscribeStock() {
        if (!subscription) {
            alert("구독 중이 아닙니다.");
            return;
        }

        subscription.unsubscribe();
        subscription = null;
        console.log(`${currentCode} 구독 해제`);
        currentCode = null;

        document.getElementById('bidask-data').innerText = '';
        document.getElementById('trade-data').innerText = '';
    }
</script>
</body>
</html>
