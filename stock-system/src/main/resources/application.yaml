debug: false

logging:
  level:
    arile.toy.stocksystem: debug
    org.springframework.web.service: debug

spring:
  application.name: stock-system
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate.ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: true
  sql.init.mode: always
