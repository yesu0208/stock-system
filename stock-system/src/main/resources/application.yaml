api:
  approval-key-url: ${APPROVAL_KEY_URL}
  app-key: ${APP_KEY}
  app-secret: ${APP_SECRET}
  ws-url: ${WS_URL}

debug: false

external:
  stocks:
    - "005930"
    - "000660"
    - "247540"
    - "086520"

jwt:
  secret-key: ${SECRET_KEY}

logging:
  level:
    arile.toy.stocksystem: debug
    org.springframework.web.service: debug

redis:
  host: localhost
  port: 6379

  streams:
    user:
      key: user-events
      consumer-group: stock-group

    order:
      prefix: order-events
      shard-count: 1
      consumer-group: stock-group

    cancel:
      prefix: cancel-events
      shard-count: 1
      consumer-group: stock-group

    auto-order:
      prefix: auto-order-events
      shard-count: 1
      consumer-group: stock-group

server:
  shard-index: 0

spring:
  application.name: stock-system
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_PW}
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate.ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: true
  sql.init.mode: always

---

spring:
  config.activate.on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username:
    password:
