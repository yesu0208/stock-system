# 서버별 /actuator/prometheus 수집
global:
  scrape_interval: 5s # 부하 테스트용 (운영 일반값은 15s)
  evaluation_interval: 5s

scrape_configs:
  - job_name: stock-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["bff-server:8080"]
        labels: { service: bff-server }
      - targets: ["account-server:8082"]
        labels: { service: account-server }
      - targets: ["stock-server:8081"]
        labels: { service: stock-server, group: A }
      - targets: ["stock-server-b:8081"]
        labels: { service: stock-server, group: B }
