# EC2 nginx 설정 (/etc/nginx/sites-available/stock-system)
# - HTTPS 종료(Let's Encrypt, Certbot), 프론트 정적 파일 제공
# - /api, /uploads, /ws-stock, /ws-order 는 bff-server(127.0.0.1:8080, docker compose)로 전달

server {
    server_name stock-system.cloud www.stock-system.cloud;

    # REST API — /api 접두사를 유지한 채 bff 로 전달 (bff 의 API 경로가 /api/**)
    location /api/ {
        # 프로필 이미지 업로드 (bff multipart 제한 5MB 와 맞춤, nginx 기본값은 1MB)
        client_max_body_size 5m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프로필 이미지 (bff 로컬 저장소에서 제공)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket - 시세용
    location /ws-stock/ {
        proxy_pass http://127.0.0.1:8080/ws-stock/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # WebSocket - 주문용
    location /ws-order/ {
        proxy_pass http://127.0.0.1:8080/ws-order/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 프론트엔드 정적 파일 (SPA: 없는 경로는 index.html)
    location / {
        root /var/www/stock-system;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stock-system.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stock-system.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS (루트, www 모두)
server {
    listen 80;
    server_name stock-system.cloud www.stock-system.cloud;
    return 301 https://$host$request_uri;
}
